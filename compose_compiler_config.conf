// Compose 編譯器的穩定性設定：列在這裡的類別會被視為 stable。
//
// Compose 只能對自己看得到來源的 Kotlin 類別推導穩定性。Java 標準函式庫的類別
// 沒有 Kotlin 的不可變資訊，所以即使實際上不可變也會被判為 unstable——而 unstable
// 的參數會讓 composable 無法被 skip，值沒變也照樣重組。
//
// 屬於這個專案的類別不放這裡：那些應該在宣告處標 @Immutable 或 @Stable，
// 讓讀 code 的人在現場就看得到。這個檔案只處理我們無法標註的外部類別。
//
// 參考 https://developer.android.com/develop/ui/compose/performance/stability/fix#configuration-file

// java.time：航班時間軸用它表達「現在」與各班次的時刻。這些型別是不可變的值物件。
java.time.LocalDateTime
java.time.LocalTime
java.time.LocalDate
